<!DOCTYPE html>
<!-- El tour es siempre oscuro, sin importar cómo tenga el teléfono quien lo abre: sus paneles
     flotan sobre el 3D y son oscuros a propósito. Sin esto, un celular en modo claro volvía el
     texto casi negro sobre esos paneles y el recorrido quedaba ilegible justo para el cliente
     al que se lo mandás. El panel de administración es otra cosa y sigue siendo claro. -->
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Tour 3D — Inmo3D</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/redesign.css">
<link rel="stylesheet" href="/mobile.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
</head>
<body>
<div class="viewer">
  <canvas id="canvas"></canvas>
  <div id="overlay"></div>
  <div class="loader" id="loader">
    <div>
      <div class="spin" style="width:28px;height:28px;margin:0 auto 12px"></div>
      <div id="loader-text" style="white-space:pre-line;max-width:34ch">Preparando el recorrido…</div>
    </div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "playcanvas": "/engine/build/playcanvas.mjs",
    "playcanvas/": "/engine/",
    "@vercel/blob/client": "https://esm.sh/@vercel/blob@1/client"
  }
}
</script>
<script type="module" src="/src/tour-boot.mjs"></script>
</body>
</html>
